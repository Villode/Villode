<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Villode technical toolbox</title>
  <desc id="desc">A command palette listing Linux, Python, Bash, GTK, Wayland, HTML, Git and ArchISO as the main technologies.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1220"/><stop offset="1" stop-color="#06090F"/></linearGradient><linearGradient id="select"><stop stop-color="#00C9FF"/><stop offset="1" stop-color="#7F00FF"/></linearGradient></defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <g transform="translate(54 40)"><text x="0" y="18" fill="#00A67E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">03 / TOOLBOX</text><text x="0" y="67" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="720">Small tools, native boundaries, visible behavior.</text></g>
  <g transform="translate(54 142)">
    <rect width="1092" height="138" rx="22" fill="#090D16" stroke="#303A50" stroke-width="2"/>
    <rect x="18" y="18" width="1056" height="38" rx="12" fill="#121A2A"/>
    <text x="38" y="44" fill="#00C9FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">›</text>
    <text x="62" y="44" fill="#AAB5C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">select the right layer for the job</text>
    <g transform="translate(18 76)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <g><rect width="112" height="42" rx="12" fill="url(#select)"/><text x="56" y="27" text-anchor="middle" fill="#FFFFFF">LINUX</text></g>
      <g transform="translate(124)"><rect width="112" height="42" rx="12" fill="#151D2E" stroke="#344057"/><text x="56" y="27" text-anchor="middle" fill="#D8DFEA">PYTHON</text></g>
      <g transform="translate(248)"><rect width="104" height="42" rx="12" fill="#151D2E" stroke="#344057"/><text x="52" y="27" text-anchor="middle" fill="#D8DFEA">BASH</text></g>
      <g transform="translate(364)"><rect width="118" height="42" rx="12" fill="#151D2E" stroke="#344057"/><text x="59" y="27" text-anchor="middle" fill="#D8DFEA">GTK 3/4</text></g>
      <g transform="translate(494)"><rect width="124" height="42" rx="12" fill="#151D2E" stroke="#344057"/><text x="62" y="27" text-anchor="middle" fill="#D8DFEA">WAYLAND</text></g>
      <g transform="translate(630)"><rect width="96" height="42" rx="12" fill="#151D2E" stroke="#344057"/><text x="48" y="27" text-anchor="middle" fill="#D8DFEA">HTML</text></g>
      <g transform="translate(738)"><rect width="82" height="42" rx="12" fill="#151D2E" stroke="#344057"/><text x="41" y="27" text-anchor="middle" fill="#D8DFEA">GIT</text></g>
      <g transform="translate(832)"><rect width="146" height="42" rx="12" fill="#10251F" stroke="#00A67E"/><text x="73" y="27" text-anchor="middle" fill="#5EE5C1">ARCHISO</text></g>
    </g>
  </g>
</svg>
