<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Villode build workflow</title>
  <desc id="desc">A five-stage workflow from terminal prototype through pinned source, live Hyprland testing, checks and release.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B12"/><stop offset="1" stop-color="#101526"/></linearGradient><linearGradient id="rail"><stop stop-color="#00C9FF"/><stop offset=".55" stop-color="#7F00FF"/><stop offset="1" stop-color="#00A67E"/></linearGradient></defs>
  <rect width="1200" height="350" rx="28" fill="url(#bg)"/>
  <g transform="translate(54 40)">
    <text x="0" y="18" fill="#7F00FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">02 / BUILD METHOD</text>
    <text x="0" y="67" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="720">From a terminal idea to a recoverable release.</text>
  </g>
  <path d="M92 206H1108" stroke="#253047" stroke-width="8" stroke-linecap="round"/>
  <path d="M92 206H1108" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(92 206)"><circle r="20" fill="#07131B" stroke="#00C9FF" stroke-width="3"/><text y="6" text-anchor="middle" fill="#00C9FF" font-size="16">01</text><text x="0" y="54" text-anchor="middle" fill="#F4F7FB" font-size="17">PROTOTYPE</text><text x="0" y="78" text-anchor="middle" fill="#78869C" font-size="13">PYTHON / BASH</text></g>
    <g transform="translate(346 206)"><circle r="20" fill="#100B1B" stroke="#6F24D5" stroke-width="3"/><text y="6" text-anchor="middle" fill="#B38AFF" font-size="16">02</text><text x="0" y="54" text-anchor="middle" fill="#F4F7FB" font-size="17">PIN SOURCE</text><text x="0" y="78" text-anchor="middle" fill="#78869C" font-size="13">FULL COMMIT SHA</text></g>
    <g transform="translate(600 206)"><circle r="24" fill="#141027" stroke="#7F00FF" stroke-width="4"/><text y="6" text-anchor="middle" fill="#C5A6FF" font-size="16">03</text><text x="0" y="54" text-anchor="middle" fill="#F4F7FB" font-size="17">LIVE SESSION</text><text x="0" y="78" text-anchor="middle" fill="#78869C" font-size="13">HYPRLAND / WAYLAND</text></g>
    <g transform="translate(854 206)"><circle r="20" fill="#071813" stroke="#00A67E" stroke-width="3"/><text y="6" text-anchor="middle" fill="#51D8B5" font-size="16">04</text><text x="0" y="54" text-anchor="middle" fill="#F4F7FB" font-size="17">VERIFY</text><text x="0" y="78" text-anchor="middle" fill="#78869C" font-size="13">CHECK / RECOVER</text></g>
    <g transform="translate(1108 206)"><circle r="20" fill="#071813" stroke="#00A67E" stroke-width="3"/><text y="6" text-anchor="middle" fill="#51D8B5" font-size="16">05</text><text x="0" y="54" text-anchor="middle" fill="#F4F7FB" font-size="17">SHIP</text><text x="0" y="78" text-anchor="middle" fill="#78869C" font-size="13">PINNED CHANNEL</text></g>
  </g>
</svg>
